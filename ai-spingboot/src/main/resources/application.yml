spring:
  servlet:
    # 文件上传限制：与前端封面契约对齐（单文件5MB；整包含表单字段放宽到6MB）
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: jdbc:mysql://localhost:3306/health_agent?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456

  ai:
    openai:
      chat:
        options:
          model: deepseek-ai/DeepSeek-R1-0528-Qwen3-8B
          tool-calling:
            enabled: true
        completions-path: /v1/chat/completions
      api-key:   #你的api-key，去硅基流动平台申请
      base-url: https://api.siliconflow.cn
# 服务器配置
server:
  port: 1236
  tomcat:
    # 拒绝超限上传时允许Tomcat吞掉剩余请求体，以便返回友好JSON错误而非直接掐断连接（ERR_CONNECTION_RESET）
    max-swallow-size: -1

# 文件上传根目录（相对路径基于工作目录；部署时可改为绝对路径）
file:
  upload-dir: ./upload

# JWT配置
jwt:
  secret: MySecretKeyForJWT2025!@#$%^&*()_+SecureKeyHere
  expiration: 86400000  # 24小时（毫秒）
  refresh-expiration: 604800000  # 7天（毫秒）
  header: Authorization  # token头部名称
  token-prefix: "Bearer "  # token前缀

